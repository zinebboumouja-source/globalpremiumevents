<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Premium Events — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #16294F;
    --blue-mid: #45659B;
    --ink-dim: #5B6270;
    --gold: #A9832E;
    --gold-light: #C3A86D;
    --line: #DDE3EC;
    --bg: #FFFFFF;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(900px circle at 50% -10%, rgba(169,131,46,0.08), transparent 60%),
      var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--ink-dim);
    padding:24px;
  }
  .card{
    text-align:center;
    max-width:560px;
  }
  .kicker{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--blue-mid);
    font-size:13px;
    font-weight:500;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .kicker .rule{ width:36px; height:1px; background:var(--gold-light); }
  h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 42px);
    color:var(--navy);
    margin:0 0 16px;
    line-height:1.25;
  }
  p.lead{
    font-size:15.5px;
    line-height:1.7;
    margin:0 0 36px;
  }
  .divider{
    width:48px;
    height:2px;
    background:var(--gold);
    margin:0 auto 36px;
  }
  .contact{
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    justify-content:center;
    font-size:14px;
    color:var(--navy);
    margin-bottom:28px;
  }
  .contact a{ color:var(--navy); text-decoration:none; border-bottom:1px solid var(--gold-light); padding-bottom:2px; }
  .contact a:hover{ color:var(--gold); }
  .foot{
    font-size:12px;
    color:#9AA3B5;
    letter-spacing:.03em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">
      <span class="rule"></span>
      <span>Global Premium Events</span>
      <span class="rule"></span>
    </div>
    <h1>A new site is on its way.</h1>
    <p class="lead">We're putting the finishing touches on our new site. In the meantime, reach out directly &mdash; we'd love to hear about your project.</p>
    <div class="divider"></div>
    <div class="contact">
      <a href="mailto:info@globalpremiumevents.com">info@globalpremiumevents.com</a>
      <a href="tel:+212653512995">+212 653512995</a>
    </div>
    <div class="foot">&copy; 2026 Global Premium Events. All rights reserved.</div>
  </div>
</body>
</html>
